# End-to-end pipeline smoke experiment.  This intentionally trades statistical
# stability for turnaround time; use deit_tiny_ps.yaml for the full 2048-sample run.
method: patch_slimming_static

model:
  name: deit_tiny_patch16_224
  num_classes: 1000

data_path: /workspace/etri_iitp/JS/Server_Compression/data/imagenet
output_dir: ./output/ps_deit_tiny_smoke

calibration:
  num_samples: 32
  batch_size: 8
  seed: 2022
  split: train
  num_workers: 4

score:
  mode: paper_path_energy_dp

search:
  epsilon: 0.02
  error_metric: mse
  search_step: 20
  max_search_iters: 1000
  score_max_batches: 4

block_finetune:
  optimizer: adamw
  learning_rate: 1.0e-5
  weight_decay: 0.0
  epochs: 1
  grad_clip_norm: 1.0

final_finetune:
  epochs: 1
  lr: 2.0e-5
  weight_decay: 0.05
  batch_size: 256
  warmup_epochs: 0
  num_workers: 8
