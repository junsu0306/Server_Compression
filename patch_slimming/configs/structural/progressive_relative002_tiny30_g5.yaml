method: patch_slimming_static
model:
  name: vit_tiny_patch16_224
  num_classes: 1000
  reduced_checkpoint: output/vit_tiny_30_final/reduced.pt
data_path: /workspace/etri_iitp/JS/Server_Compression/data/imagenet
output_dir: ./output/ps_structural_progressive_relative002/vit_tiny_30_final_g5
calibration: {num_samples: 1024, batch_size: 8, seed: 2022, split: train, num_workers: 8}
score_data: {num_samples: 1024, batch_size: 8, seed: 2022, split: train, num_workers: 8}
reconstruction_train: {num_samples: 1024, batch_size: 8, seed: 2023, split: train, num_workers: 8}
reconstruction_eval: {num_samples: 1024, batch_size: 8, seed: 2024, split: train, num_workers: 8}
score: {mode: paper_path_energy_dp}
search:
  epsilon: 0.02
  error_metric: sample_relative_frobenius_sq_mean
  search_step: 10
  min_growth_per_shallower_layer: 5
  max_search_iters: 10000
  score_max_batches: null
block_finetune: {optimizer: adamw, learning_rate: 1.0e-5, weight_decay: 0.0, epochs: 3, grad_clip_norm: 1.0}
final_finetune: {epochs: 1, lr: 2.0e-5, weight_decay: 0.05, batch_size: 256, warmup_epochs: 0, num_workers: 8}
wandb:
  enabled: true
  project: vit-patch-slimming-progressive-search
  run_name: tiny30-relative002-progressive-g5
