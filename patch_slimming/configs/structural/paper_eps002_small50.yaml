method: patch_slimming_static
model:
  name: vit_small_patch16_224
  num_classes: 1000
  reduced_checkpoint: output/vit_small_50_final/reduced.pt
data_path: /workspace/etri_iitp/JS/Server_Compression/data/imagenet
output_dir: ./output/ps_structural_paper_eps002/vit_small_50_final
calibration: {num_samples: 1024, batch_size: 8, seed: 2022, split: train, num_workers: 8}
score: {mode: paper_path_energy_dp}
search: {epsilon: 0.02, error_metric: mse, search_step: 10, max_search_iters: 10000, score_max_batches: null}
block_finetune: {optimizer: adamw, learning_rate: 1.0e-5, weight_decay: 0.0, epochs: 3, grad_clip_norm: 1.0}
final_finetune: {epochs: 1, lr: 2.0e-5, weight_decay: 0.05, batch_size: 128, warmup_epochs: 0, num_workers: 8, wandb: true, wandb_project: vit-structural-patch-slimming-paper-eps002, wandb_run_name: small50-paper-eps002-recovery}
wandb: {enabled: true, project: vit-structural-patch-slimming-paper-eps002, run_name: small50-paper-eps002-search}
