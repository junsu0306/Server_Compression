# ViT-Tiny  |  50% FFN compression + Cropr token pruning
#
# 실행 전제: reduced.pt 가 먼저 생성되어 있어야 함
#   python reduce.py --model vit_tiny_patch16_224 \
#     --checkpoint ./output/vit_tiny_prune50_progressive_taylor/checkpoint_best.pt \
#     --output     ./output/vit_tiny_prune50_progressive_taylor/reduced.pt
#
# 실행 (GPU 6,7):
#   CUDA_VISIBLE_DEVICES=6,7 torchrun --nproc_per_node=2 --master-port 29502 train_cropr.py \
#     --config configs/vit_tiny_prune50_cropr.yaml

reduced: ./output/vit_tiny_prune50_progressive_taylor/reduced.pt
data_path: /workspace/etri_iitp/JS/Server_Compression/data/imagenet

# ── 학습 ──────────────────────────────────────────────────────────
epochs: 30
batch_size: 256        # per GPU
lr: 1.0e-4             # Cropr 모듈은 처음부터 학습 → 기존 fine-tuning보다 높은 LR
weight_decay: 0.05
clip_grad: 1.0
warmup_epochs: 3
min_lr: 1.0e-6
smoothing: 0.1
amp: true
num_workers: 8

# ── EMA ───────────────────────────────────────────────────────────
model_ema: true
model_ema_decay: 0.9998

# ── Cropr 설정 ────────────────────────────────────────────────────
# ViT-Tiny: 197 tokens (196 patches + 1 CLS)
# 블록 3, 6, 9에서 각각 33, 32, 32개 제거
# → 197 → 164 → 132 → 100 tokens  (49% 토큰 감소)
cropr_locs: [3, 6, 9]
cropr_rate: 32
cropr_llf: false          # Last Layer Fusion (true=마지막 블록 전 제거 토큰 재결합)

# backbone freeze 설정
freeze_backbone: false    # true=Cropr만 학습, false=전체 학습
freeze_epochs: 0          # 0보다 크면 해당 epoch까지 backbone frozen

# ── 출력 ──────────────────────────────────────────────────────────
output_dir: ./output/vit_tiny_prune50_cropr

# ── WandB ─────────────────────────────────────────────────────────
wandb: true
wandb_project: vit-pruning
wandb_run_name: "vit_tiny_prune50_cropr"
