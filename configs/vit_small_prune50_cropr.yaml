# ViT-Small  |  50% FFN compression + Cropr token pruning
#
# 실행 전제: reduced.pt 가 먼저 생성되어 있어야 함
#   python reduce.py --model vit_small_patch16_224 \
#     --checkpoint ./output/vit_small_prune50_progressive_taylor/checkpoint_best.pt \
#     --output     ./output/vit_small_prune50_progressive_taylor/reduced.pt
#
# 실행 (GPU 4,5):
#   CUDA_VISIBLE_DEVICES=4,5 torchrun --nproc_per_node=2 --master-port 29503 train_cropr.py \
#     --config configs/vit_small_prune50_cropr.yaml

reduced: ./output/vit_small_prune50_progressive_taylor/reduced.pt
data_path: /workspace/etri_iitp/JS/Server_Compression/data/imagenet

# ── 학습 ──────────────────────────────────────────────────────────
epochs: 30
batch_size: 128        # per GPU
lr: 1.0e-4
weight_decay: 0.05
clip_grad: 1.0
warmup_epochs: 3
min_lr: 1.0e-6
smoothing: 0.1
amp: true
num_workers: 8

# ── EMA ───────────────────────────────────────────────────────────
model_ema: true
model_ema_decay: 0.9998

# ── Cropr 설정 ────────────────────────────────────────────────────
# ViT-Small: 197 tokens (196 patches + 1 CLS)
# 블록 3, 6, 9에서 각각 33, 32, 32개 제거
# → 197 → 164 → 132 → 100 tokens  (49% 토큰 감소)
cropr_locs: [3, 6, 9]
cropr_rate: 32
cropr_llf: false

freeze_backbone: false
freeze_epochs: 0

# ── 출력 ──────────────────────────────────────────────────────────
output_dir: ./output/vit_small_prune50_cropr

# ── WandB ─────────────────────────────────────────────────────────
wandb: true
wandb_project: vit-pruning
wandb_run_name: "vit_small_prune50_cropr"
