# ViT-Tiny 30%  |  Stage 2 NPU-safe 테스트 (10 epoch만, 컴파일 가능 여부 검증용)
#
# 목적: pruning/token_pruning_npu.py의 3가지 수정(ScatterElements 제거,
#       export시 batch=1 index_select, dynamo=False)이 실제로 Aries2/qbcompiler를
#       통과하는지 빠르게 확인. 정확도 검증용이 아니라 "컴파일 되는지"만 보는 것이라
#       10 epoch으로 짧게 잡았다. 기존 vit_tiny_30_token_prune70.yaml(정식 30 epoch
#       run)과는 output_dir이 분리되어 있어 서로 덮어쓰지 않는다.
#
# 실행 (GPU 6,7):
#   CUDA_VISIBLE_DEVICES=6,7 torchrun --nproc_per_node=2 --master_port=29509 train_token_pruning.py \
#     --config configs/vit_tiny_30_token_prune70_npu_test.yaml

reduced: ./output/vit_tiny_30_final/reduced.pt
data_path: /workspace/etri_iitp/JS/Server_Compression/data/imagenet

npu_safe: true   # pruning/token_pruning_npu.py의 forward 사용

# ── 학습 (10 epoch — 컴파일 테스트용, 정확도 검증 아님) ────────────
epochs: 10
batch_size: 256
lr: 2.0e-5
weight_decay: 0.05
clip_grad: 1.0
warmup_epochs: 1
min_lr: 1.0e-6
smoothing: 0.1
amp: true
num_workers: 8

# ── EMA ───────────────────────────────────────────────────────────
model_ema: true
model_ema_decay: 0.9998

# ── EViT Token Pruning (Progressive, 10 epoch에 맞춰 축소) ────────
base_keep_rate: 0.7
prune_layers: ""            # 자동(depth//4 등분 → [3,6,9])
fuse_token: true
keep_rate_warmup_epochs: 1  # epoch 0: 정상 학습
keep_rate_ramp_epochs: 4    # epoch 1~4: keep_rate 1.0 → 0.7
                             # epoch 5~9: keep_rate 0.7 유지 (5 epoch 여유, best 후보 확보)

# ── Knowledge Distillation ────────────────────────────────────────
kd_alpha: 0.5
kd_temperature: 4.0
kd_teacher_mode: reduced

# ── 출력 (정식 run과 분리) ──────────────────────────────────────────
output_dir: ./output/vit_tiny_30_final/token_prune70_npu_test

# ── WandB ─────────────────────────────────────────────────────────
wandb: true
wandb_project: vit-token-pruning
wandb_run_name: "vit_tiny_30_final_token70_npu_test"
