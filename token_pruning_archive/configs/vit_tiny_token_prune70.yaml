# ViT-Tiny  |  Stage 2 — EViT Token Pruning (keep_rate=0.7)
#
# 전제: Stage 1(soft channel pruning) → reduce.py 완료 후 reduced.pt 필요
#   python reduce.py --model vit_tiny_patch16_224 \
#     --checkpoint ./output/vit_tiny_prune50_progressive_taylor/checkpoint_best.pt \
#     --output     ./output/vit_tiny_prune50_progressive_taylor/reduced.pt
#
# 실행 (GPU 6,7):
#   CUDA_VISIBLE_DEVICES=6,7 torchrun --nproc_per_node=2 train_token_pruning.py \
#     --config configs/vit_tiny_token_prune70.yaml

reduced: ./output/vit_tiny_50_final/reduced.pt
data_path: /workspace/etri_iitp/JS/Server_Compression/data/imagenet

# ── 학습 (Stage 1보다 짧고 낮은 lr) ──────────────────────────────
epochs: 30
batch_size: 256
lr: 2.0e-5
weight_decay: 0.05
clip_grad: 1.0
warmup_epochs: 3
min_lr: 1.0e-6
smoothing: 0.1
amp: true
num_workers: 8

# ── EMA ───────────────────────────────────────────────────────────
model_ema: true
model_ema_decay: 0.9998

# ── EViT Token Pruning (Progressive) ──────────────────────────────
base_keep_rate: 0.7         # patch 토큰의 70% 유지 (block 3,6,9 — 자동 산출)
prune_layers: ""            # 비우면 depth//4 지점 자동 선택 (12-block → [3,6,9])
fuse_token: true
keep_rate_warmup_epochs: 3  # epoch 0~2: token pruning 없이 정상 학습
keep_rate_ramp_epochs: 12   # epoch 3~14: keep_rate 1.0 → 0.7 점진 감소
                             # epoch 15~29: keep_rate 0.7 유지

# ── Knowledge Distillation ────────────────────────────────────────
kd_alpha: 0.5
kd_temperature: 4.0
kd_teacher_mode: reduced    # self-distillation: token pruning 적용 전 reduced 모델

# ── 출력 ──────────────────────────────────────────────────────────
output_dir: ./output/vit_tiny_50_final/token_prune70

# ── WandB ─────────────────────────────────────────────────────────
wandb: true
wandb_project: vit-token-pruning   # Stage 1과 분리된 새 프로젝트
wandb_run_name: "vit_tiny_50_final_token70"
